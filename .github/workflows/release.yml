name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          echo "VERSION=$(date +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "BUILD=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Install dmgbuild
        run: python3 -m pip install --quiet dmgbuild

      - name: Build app and DMG
        run: ./scripts/make-dmg.sh

      - name: Publish to landing page
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          set -euo pipefail
          PAGES="https://x-access-token:${PAGES_TOKEN}@github.com/behnambm/behnambm.github.io.git"
          git clone --quiet "$PAGES" pages
          cd pages
          mkdir -p engram/downloads
          cp ../dist/Engram.dmg "engram/downloads/Engram-${VERSION}-${BUILD}.dmg"
          cp ../dist/Engram.dmg engram/Engram.dmg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engram
          git commit -m "chore(engram): publish ${VERSION}-${BUILD}" || echo "nothing to commit"
          git push

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Engram-${{ env.VERSION }}-${{ env.BUILD }}
          path: dist/Engram.dmg
