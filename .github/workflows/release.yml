name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute version
        run: |
          echo "VERSION=$(date +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "BUILD=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Install dmgbuild
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet dmgbuild

      - name: Build app and DMG
        run: |
          source .venv/bin/activate
          ./scripts/make-dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ env.VERSION }}-${{ env.BUILD }}
          name: Engram ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: dist/Engram.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Engram-${{ env.VERSION }}-${{ env.BUILD }}
          path: dist/Engram.dmg
          if-no-files-found: error
